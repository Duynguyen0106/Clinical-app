# Hourly patient jobs for Cloudflare Worker (Vercel Hobby cannot run sub-daily cron).
# Requires repo secrets:
#   CRON_SECRET  — must match Worker secret CRON_SECRET (≥24 chars)
#   APP_BASE_URL — optional; blank/unset defaults to the Worker URL below
name: Cron jobs

on:
  schedule:
    # Reminders + patient-emails hourly
    - cron: "5 * * * *"
    # Organise drain every 15 minutes (Hobby-friendly vs */5)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        type: choice
        options:
          - all-hourly
          - reminders
          - patient-emails
          - organise
        default: all-hourly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke job(s)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "Missing repo secret CRON_SECRET — add it under Settings → Secrets → Actions" >&2
            echo "It must match the Worker secret CRON_SECRET (wrangler secret put CRON_SECRET)." >&2
            exit 1
          fi
          # Trim; treat blank APP_BASE_URL as unset (GitHub may inject empty string).
          BASE="$(echo -n "${APP_BASE_URL:-}" | tr -d '[:space:]')"
          if [[ -z "$BASE" ]]; then
            BASE="https://treow-clinic.duydichdanh.workers.dev"
          fi
          BASE="${BASE%/}"
          echo "Cron target host: ${BASE}"
          hit() {
            local path="$1"
            echo "GET ${BASE}${path}"
            local code
            code=$(curl -sS -o /tmp/cron-body.txt -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE}${path}" || true)
            echo "HTTP ${code}"
            if [[ "$code" != "200" ]]; then
              head -c 400 /tmp/cron-body.txt || true
              echo
              if [[ "$code" == "401" || "$code" == "403" ]]; then
                echo "Auth failed — GitHub Actions CRON_SECRET does not match Worker CRON_SECRET." >&2
              fi
              exit 1
            fi
            head -c 500 /tmp/cron-body.txt || true
            echo
          }
          # schedule cron strings from `on.schedule`
          if [[ -n "${EVENT_SCHEDULE:-}" ]]; then
            if [[ "$EVENT_SCHEDULE" == "*/15 * * * *" ]]; then
              hit /api/v1/jobs/organise
            else
              hit /api/v1/jobs/reminders
              hit /api/v1/jobs/patient-emails
            fi
            exit 0
          fi
          case "${INPUT_JOB:-all-hourly}" in
            reminders) hit /api/v1/jobs/reminders ;;
            patient-emails) hit /api/v1/jobs/patient-emails ;;
            organise) hit /api/v1/jobs/organise ;;
            *)
              hit /api/v1/jobs/reminders
              hit /api/v1/jobs/patient-emails
              hit /api/v1/jobs/organise
              ;;
          esac
